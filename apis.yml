aid: project-europe
name: Project Europe
description: Project Europe (styled "Project Europe - LFG") is an initiative supporting
  the next generation of European founders. It runs an open application process for
  early-stage founders, backs and showcases a portfolio of companies started by that
  community, publishes an investor prospectus, and convenes a network of experienced
  European operators and investors. Surfaced in the API Evangelist network as a portfolio
  company of point-nine, Project Europe operates as a founder-community and early
  backing program rather than a public API or developer platform - its public web
  presence is a marketing site (apply, portfolio, legal pages) with no documented
  public API surface.
